name: Build Plugin

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build bằng Maven
        run: mvn clean package --batch-mode

      - name: Xuất file JAR
        uses: actions/upload-artifact@v4
        with:
          name: TierPlugin-Jar
          path: target/*.jar
